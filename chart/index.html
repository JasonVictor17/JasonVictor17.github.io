<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板 - Jingde's Blog</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    .nav-bar {
      background: #222;
      padding: 16px 0;
      text-align: center;
    }
    .nav-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      margin: 0 20px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .nav-bar a:hover { opacity: 1; }
    .nav-bar a.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 4px; }
    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #222;
    }
    .page-desc {
      font-size: 14px;
      color: #999;
      margin-bottom: 32px;
    }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 32px;
      margin-bottom: 24px;
    }
    .chart-card h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-height: 400px;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-box {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 24px;
      text-align: center;
    }
    .stat-box .value {
      font-size: 32px;
      font-weight: 700;
      color: #222;
    }
    .stat-box .label {
      font-size: 13px;
      color: #999;
      margin-top: 4px;
    }
    .stat-box .change {
      font-size: 13px;
      margin-top: 8px;
    }
    .change.up { color: #22c55e; }
    .change.down { color: #ef4444; }
    @media (max-width: 600px) {
      .stats-row { flex-direction: column; }
      .container { margin: 20px auto; }
      .chart-card { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="nav-bar">
  <a href="/">首页</a>
  <a href="/about/">关于</a>
  <a href="/chart/" class="active">数据看板</a>
  <a href="/archives/">归档</a>
</div>

<div class="container">
  <h1 class="page-title">📊 数据看板</h1>
  <p class="page-desc">这是一个数据可视化 Demo 页面，后续可接入真实数据。</p>

  <div class="stats-row">
    <div class="stat-box">
      <div class="value" id="stat-date">--</div>
      <div class="label">数据更新日期</div>
    </div>
    <div class="stat-box">
      <div class="value" id="stat-sharpe">--</div>
      <div class="label">TOP15平均收益率(%)</div>
    </div>
    <div class="stat-box">
      <div class="value" id="stat-ind">--</div>
      <div class="label">TOP10行业平均收益率(%)</div>
    </div>
    <div class="stat-box">
      <div class="value" id="stat-count">--</div>
      <div class="label">上榜股票数</div>
    </div>
  </div>

  <div class="chart-card">
    <h2>TOP15高股息股平均收益率走势</h2>
    <div class="chart-wrapper">
      <canvas id="visitChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>TOP15高夏普分红股（本周）</h2>
    <div style="overflow-x:auto">
      <table id="sharpeTable" style="width:100%;border-collapse:collapse;font-size:14px">
      </table>
    </div>
  </div>

  <div class="chart-card">
    <h2>分红 V.S. 风险散点图</h2>
    <img src="/chart/data/dividend_scatter.jpg" style="width:100%;border-radius:8px"
         onerror="this.parentNode.innerHTML='<p style=\'color:#999\'>暂无图片数据</p>'">
  </div>
</div>

<script>
async function render() {
  let history = [], latest = null;
  try {
    history = await (await fetch('/chart/data/dividend_history.json')).json();
    latest  = await (await fetch('/chart/data/dividend_latest.json')).json();
  } catch (e) {
    console.warn('数据文件不存在，使用演示数据');
  }

  new Chart(document.getElementById('visitChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: history.map(d => d.date),
      datasets: [
        {
          label: 'TOP15高夏普股平均收益率(%)',
          data: history.map(d => d.avg_top15_sharpe_ratio),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.08)',
          borderWidth: 2.5, pointRadius: 3, fill: true, tension: 0.35
        },
        {
          label: 'TOP10高分红行业平均收益率(%)',
          data: history.map(d => d.avg_top10_ind_ratio),
          borderColor: '#f59e0b',
          borderWidth: 2, pointRadius: 3, tension: 0.35
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top', labels: { usePointStyle: true } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#999' } },
        y: { grid: { color: '#f0f0f0' }, ticks: { color: '#999' } }
      }
    }
  });

  if (latest && latest.top15_sharpe) {
    const cols = ['code', '名称', '行业', '收益率(%)', '波动率', '夏普'];
    const rows = latest.top15_sharpe.map(r =>
      `<tr>${cols.map(c => `<td style="padding:8px;border-bottom:1px solid #eee">${r[c] ?? r['名称'] ?? ''}</td>`).join('')}</tr>`);
    document.getElementById('sharpeTable').innerHTML =
      `<tr style="background:#f8f8f8;font-weight:600">${cols.map(c => `<td style="padding:8px">${c}</td>`).join('')}</tr>` + rows.join('');
  }

  if (latest) {
    document.querySelector('.page-desc').textContent =
      `数据更新时间：${latest.date}（每周自动更新）`;
    document.getElementById('stat-date').textContent = latest.date;
    document.getElementById('stat-sharpe').textContent =
      history.length ? history[history.length - 1].avg_top15_sharpe_ratio : '--';
    document.getElementById('stat-ind').textContent =
      history.length ? history[history.length - 1].avg_top10_ind_ratio : '--';
    document.getElementById('stat-count').textContent = latest.top15_sharpe.length;
  }
}
render();
</script>

</body>
</html>
