<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红利动量策略回测 - Jingde's Blog</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f7fa; color: #333; }
    .nav-bar { background: #222; padding: 16px 0; text-align: center; }
    .nav-bar a { color: #fff; text-decoration: none; font-size: 16px; margin: 0 20px; opacity: 0.8; transition: opacity 0.2s; }
    .nav-bar a:hover { opacity: 1; }
    .nav-bar a.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 4px; }
    .container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
    .page-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #222; }
    .page-desc { font-size: 14px; color: #999; margin-bottom: 8px; }
    .params-desc { font-size: 12px; color: #bbb; margin-bottom: 32px; }
    .chart-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 32px; margin-bottom: 24px; }
    .chart-card h2 { font-size: 18px; margin-bottom: 20px; color: #333; }
    .chart-wrapper { position: relative; width: 100%; height: 380px; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-box { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px; text-align: center; }
    .stat-box .value { font-size: 26px; font-weight: 700; color: #222; }
    .stat-box .label { font-size: 13px; color: #999; margin-top: 4px; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl td, .tbl th { padding: 8px; border-bottom: 1px solid #eee; }
    .tbl th { background: #f8f8f8; font-weight: 600; }
    .num { text-align: right; }
    .up { color: #22c55e; } .down { color: #ef4444; }
    .foot-row td { font-weight: 600; background: #fafafa; }
    select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    @media (max-width: 600px) {
      .stats-row { flex-direction: column; }
      .container { margin: 20px auto; }
      .chart-card { padding: 20px; }
      .chart-wrapper { height: 300px; }
    }
  </style>
</head>
<body>

<div class="nav-bar">
  <a href="/">首页</a>
  <a href="/about/">关于</a>
  <a href="/chart/" class="active">数据看板</a>
  <a href="/archives/">归档</a>
</div>

<div style="text-align:center;background:#fff;border-bottom:1px solid #eee;padding:10px 0">
  <a href="/chart/dividend/" style="display:inline-block;margin:0 14px;font-size:14px;color:#999">功能1：红利股全览</a>
  <a href="/chart/momentum/" style="display:inline-block;margin:0 14px;font-size:14px;color:#999">功能2：红利动量策略选股（大市值）</a>
  <a href="/chart/backtest/" style="display:inline-block;margin:0 14px;font-size:14px;color:#222;font-weight:600;border-bottom:2px solid #222;padding-bottom:4px">功能3：红利动量策略回测</a>
</div>

<div class="container">
  <h1 class="page-title">🧪 红利动量策略回测</h1>
  <p class="page-desc" id="page-desc">数据加载中…</p>
  <!-- 策略参数明细已隐藏（DOM 元素也一并移除，避免留下空白行） -->

  <div class="stats-row">
    <div class="stat-box"><div class="value" id="stat-range" style="font-size:16px">--</div><div class="label">回测区间</div></div>
    <div class="stat-box"><div class="value" id="stat-nav">--</div><div class="label">最新净值</div></div>
    <div class="stat-box"><div class="value" id="stat-total">--</div><div class="label">累计收益</div></div>
    <div class="stat-box"><div class="value" id="stat-ytd">--</div><div class="label" id="stat-ytd-label">当年收益</div></div>
  </div>

  <div class="chart-card">
    <h2>① 累计净值曲线对比</h2>
    <div class="chart-wrapper"><canvas id="navChart"></canvas></div>
  </div>

  <div class="chart-card">
    <h2>② 当年净值曲线对比（年初 = 1）</h2>
    <div class="chart-wrapper"><canvas id="ytdChart"></canvas></div>
  </div>

  <div class="chart-card">
    <h2>③ 总资产曲线（初始资金 100 万）</h2>
    <div class="chart-wrapper"><canvas id="assetChart"></canvas></div>
  </div>

  <div class="chart-card">
    <h2>④ 业绩表现（累计 & 当年）</h2>
    <div style="overflow-x:auto"><table class="tbl" id="perfTable"></table></div>
    <p style="font-size:12px;color:#bbb;margin-top:10px">当年收益以上一年最后一个交易日净值为基准；基准为中证红利全收益指数（拉取失败时回退为红利股票池等权）</p>
  </div>

  <div class="chart-card">
    <h2>⑤ 当前持仓（每日按收盘价重估）</h2>
    <p style="font-size:12px;color:#bbb;margin:-10px 0 14px">持仓股数只在调仓日变化（当前为每周三），权重与市值每个交易日随收盘价更新</p>
    <div style="overflow-x:auto"><table class="tbl" id="holdTable"></table></div>
  </div>

  <div class="chart-card">
    <h2>⑥ 历史换仓查询</h2>
    <select id="rebalSelect"></select>
    <p id="rebal-meta" style="font-size:12px;color:#999;margin-bottom:12px"></p>
    <div style="overflow-x:auto"><table class="tbl" id="rebalTable"></table></div>
  </div>

</div>

<script>
async function fetchJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' 加载失败: ' + res.status);
  return res.json();
}
const fmtPct = x => (x == null || isNaN(x)) ? '--' : (x * 100).toFixed(2) + '%';
const fmtNum = (x, d = 2) => (x == null || isNaN(x)) ? '--' : Number(x).toFixed(d);
const fmtWan = x => (x == null || isNaN(x)) ? '--' :
  Number(x).toLocaleString('zh-CN', { maximumFractionDigits: 1 });
const fmtDate = s => (s && s.length === 8) ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}` : (s || '--');
const pctColor = x => (x == null || isNaN(x)) ? '' : (x >= 0 ? 'up' : 'down');

function lineChart(id, labels, datasets, yTitle) {
  new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top' } },
      scales: {
        x: { ticks: { maxTicksLimit: 12, maxRotation: 0 } },
        y: { title: { display: true, text: yTitle } }
      }
    }
  });
}

function ytdSeries(nav, key) {
  const year = nav[nav.length - 1].date.slice(0, 4);
  const prev = nav.filter(d => d.date < year + '-01-01');
  const cur = nav.filter(d => d.date >= year + '-01-01');
  const base = prev.length ? prev[prev.length - 1][key] : cur[0][key];
  return { labels: cur.map(d => d.date), values: cur.map(d => base ? d[key] / base : null) };
}

let REBAL_DATA = [];
function renderRebal(i) {
  const r = REBAL_DATA[i];
  if (!r) return;
  const head = `<tr><th>代码</th><th>名称</th><th class="num">股数</th><th class="num">买入价</th>
    <th class="num">成本(元)</th><th class="num">权重</th><th class="num">区间收益</th><th>备注</th></tr>`;
  const rows = (r.stocks || []).map(s =>
    `<tr>
      <td style="color:#888">${s.code}</td>
      <td style="font-weight:600">${s.name}</td>
      <td class="num">${s.shares != null ? s.shares.toLocaleString('zh-CN') : '--'}</td>
      <td class="num">${fmtNum(s.buy, 2)}</td>
      <td class="num">${fmtWan(s.cost)}</td>
      <td class="num">${fmtPct(s.weight)}</td>
      <td class="num ${pctColor(s.ret)}">${fmtPct(s.ret)}</td>
      <td>${s.stop_date ? '⛔ ' + fmtDate(s.stop_date) + ' 止损' : ''}</td>
    </tr>`).join('');
  const foot = `<tr class="foot-row">
      <td colspan="4">现金 ${fmtWan(r.cash)} 元 ｜ 调仓后总值 ${fmtWan(r.total)} 元</td>
      <td class="num" colspan="2">换手率 ${fmtPct(r.turnover)}</td>
      <td colspan="2">候选池 ${r.pool_size ?? '--'} 只</td></tr>`;
  document.getElementById('rebalTable').innerHTML = head + rows + foot;
  document.getElementById('rebal-meta').textContent =
    `${fmtDate(r.date)} 调仓，持有至 ${fmtDate(r.end_date)}，共 ${ (r.stocks || []).length } 只`;
}

async function render() {
  let data = null, snaps = [];
  try {
    data = await fetchJson('/chart/data/backtest_momentum.json');
  } catch (e) {
    document.getElementById('page-desc').textContent =
      '⚠️ 数据文件尚未就绪（' + e.message + '）。请确认 backtest_high_dividend_mom.py 已成功运行并推送到 GitHub。';
    return;
  }
  try { snaps = await fetchJson('/chart/data/backtest_snapshots.json'); } catch (e) { console.warn(e); }

  const p = data.params || {}, m = data.metrics || {}, nav = data.nav || [];
  const benchKeys = Object.keys(nav[0] || {}).filter(k => !['date', 'strategy', 'pool'].includes(k));
  const benchKey = benchKeys[0] || 'pool';
  const benchName = benchKeys[0] || '红利池等权';
  const cap = (p.init_capital || 1000000) / 1e4;   // 万元

  document.getElementById('page-desc').textContent =
    `回测区间 ${p.start} ~ ${p.end}（数据每个交易日更新）`;

  // 统计卡
  const lastNav = nav.length ? nav[nav.length - 1] : null;
  document.getElementById('stat-range').textContent = `${p.start} ~ ${p.end}`;
  document.getElementById('stat-nav').textContent = lastNav ? fmtNum(lastNav.strategy, 3) : '--';
  const tot = m.strategy ? m.strategy.total : null;
  const elT = document.getElementById('stat-total');
  elT.textContent = fmtPct(tot); elT.className = 'value ' + pctColor(tot);
  const my = data.metrics_ytd;
  if (my) {
    document.getElementById('stat-ytd-label').textContent = `${my.year} 年收益`;
    const yv = my.strategy ? my.strategy.total : null;
    const elY = document.getElementById('stat-ytd');
    elY.textContent = fmtPct(yv); elY.className = 'value ' + pctColor(yv);
  }

  // ① 累计净值对比
  const labels = nav.map(d => d.date);
  lineChart('navChart', labels, [
    { label: `策略 TOP${p.top_n}`, data: nav.map(d => d.strategy), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.08)', pointRadius: 0, borderWidth: 1.8 },
    { label: benchName, data: nav.map(d => d[benchKey]), borderColor: '#f59e0b', pointRadius: 0, borderWidth: 1.4 },
    { label: '红利池等权', data: nav.map(d => d.pool), borderColor: '#94a3b8', borderDash: [4, 3], pointRadius: 0, borderWidth: 1.2 }
  ], '净值');

  // ② 当年净值对比
  if (nav.length) {
    const ys = ytdSeries(nav, 'strategy'), yb = ytdSeries(nav, benchKey), yp = ytdSeries(nav, 'pool');
    lineChart('ytdChart', ys.labels, [
      { label: `策略 TOP${p.top_n}`, data: ys.values, borderColor: '#ef4444', pointRadius: 0, borderWidth: 1.8 },
      { label: benchName, data: yb.values, borderColor: '#f59e0b', pointRadius: 0, borderWidth: 1.4 },
      { label: '红利池等权', data: yp.values, borderColor: '#94a3b8', borderDash: [4, 3], pointRadius: 0, borderWidth: 1.2 }
    ], '净值（年初=1）');
  }

  // ③ 总资产曲线
  lineChart('assetChart', labels, [
    { label: '策略总资产(万元)', data: nav.map(d => d.strategy * cap), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,.08)', fill: true, pointRadius: 0, borderWidth: 1.8 },
    { label: '初始资金', data: nav.map(() => cap), borderColor: '#94a3b8', borderDash: [5, 4], pointRadius: 0, borderWidth: 1 }
  ], '总资产（万元）');

  // ④ 业绩表（累计 & 当年）
  const s = m.strategy || {}, py = m.pool_benchmark || {};
  const idxB = m.index_benchmarks || {};
  const bKey = Object.keys(idxB)[0];
  const b = bKey ? idxB[bKey] : py;
  const bName = bKey || '红利池等权';
  const ys = (my && my.strategy) || {}, yb = (my && my.benchmark) || {};
  const nStops = (data.rebalances || []).flatMap(r => r.stocks || []).filter(x => x.stop_date).length;
  const rows = [
    ['累计收益', fmtPct(s.total), fmtPct(b.total), fmtPct(ys.total), fmtPct(yb.total)],
    ['年化收益', fmtPct(s.ann), fmtPct(b.ann), '--', '--'],
    ['最大回撤', fmtPct(s.mdd), fmtPct(b.mdd), fmtPct(ys.mdd), fmtPct(yb.mdd)],
    ['年化波动', fmtPct(s.vol), fmtPct(b.vol), fmtPct(ys.vol), fmtPct(yb.vol)],
    ['夏普比率', fmtNum(s.sharpe), fmtNum(b.sharpe), fmtNum(ys.sharpe), fmtNum(yb.sharpe)],
    ['卡玛比率', fmtNum(s.calmar), fmtNum(b.calmar), fmtNum(ys.calmar), fmtNum(yb.calmar)],
    ['Beta', fmtNum(m.beta), '--', '--', '--'],
    ['Alpha(年化)', fmtPct(m.alpha_ann), '--', '--', '--'],
    ['期数胜率', fmtPct(m.win_rate), '--', '--', '--'],
    ['平均换手', fmtPct(m.avg_turnover), '--', '--', '--'],
    ['止损次数', nStops, '--', '--', '--']
  ];
  document.getElementById('perfTable').innerHTML =
    `<tr><th>指标</th><th class="num">累计·策略</th><th class="num">累计·${bName}</th>
     <th class="num">当年·策略</th><th class="num">当年·${bName}</th></tr>` +
    rows.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(v => `<td class="num">${v}</td>`).join('')}</tr>`).join('');

  // ⑤ 当前持仓（最新每日快照）
  const nameMap = {};
  (data.rebalances || []).forEach(r => (r.codes || []).forEach((c, i) => nameMap[c] = (r.names || [])[i]));
  const ht = document.getElementById('holdTable');
  if (snaps.length) {
    const last = snaps[snaps.length - 1];
    const head = `<tr><th>代码</th><th>名称</th><th class="num">股数</th><th class="num">收盘价</th>
      <th class="num">市值(元)</th><th class="num">权重</th></tr>`;
    const body = last.holdings.map(h =>
      `<tr><td style="color:#888">${h[0]}</td>
        <td style="font-weight:600">${nameMap[h[0]] || '--'}</td>
        <td class="num">${h[1].toLocaleString('zh-CN')}</td>
        <td class="num">${fmtNum(h[2], 2)}</td>
        <td class="num">${fmtWan(h[1] * h[2])}</td>
        <td class="num">${fmtPct(h[3])}</td></tr>`).join('');
    const mv = last.holdings.reduce((a, h) => a + h[1] * h[2], 0);
    const foot = `<tr class="foot-row"><td colspan="4">截至 ${fmtDate(last.date)} ｜ 现金 ${fmtWan(last.cash)} 元</td>
      <td class="num">持仓市值 ${fmtWan(mv)} 元</td><td class="num">总资产 ${fmtWan(last.total)} 元</td></tr>`;
    ht.innerHTML = head + body + foot;
  } else {
    ht.innerHTML = '<tr><td style="color:#999;padding:16px">暂无每日快照数据（需运行新版回测脚本生成 backtest_snapshots.json）</td></tr>';
  }

  // ⑥ 历史换仓查询
  REBAL_DATA = data.rebalances || [];
  const sel = document.getElementById('rebalSelect');
  sel.innerHTML = REBAL_DATA.map((r, i) =>
    `<option value="${i}">${fmtDate(r.date)}（${(r.stocks || []).length} 只）</option>`).join('');
  if (REBAL_DATA.length) {
    sel.value = REBAL_DATA.length - 1;
    renderRebal(REBAL_DATA.length - 1);
    sel.addEventListener('change', () => renderRebal(Number(sel.value)));
  }
}
render();
</script>

</body>
</html>
