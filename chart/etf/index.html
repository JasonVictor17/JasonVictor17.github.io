<script>
// ETF 轮动策略的数据目录（各策略输出分文件夹：红利动量在 /chart/data/momentum/）
const DATA_DIR = '/chart/data/etf';
async function fetchJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' 加载失败: ' + res.status);
  return res.json();
}
const fmtPct = x => (x == null || isNaN(x)) ? '--' : (x * 100).toFixed(2) + '%';
const fmtNum = (x, d = 2) => (x == null || isNaN(x)) ? '--' : Number(x).toFixed(d);
const fmtWan = x => (x == null || isNaN(x)) ? '--' :
  Number(x).toLocaleString('zh-CN', { maximumFractionDigits: 1 });
const fmtDate = s => (s && s.length === 8) ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}` : (s || '--');
const pctColor = x => (x == null || isNaN(x)) ? '' : (x >= 0 ? 'up' : 'down');
// 日均成交量（股）→ 亿/万 股
const fmtVol = v => (v == null || isNaN(v)) ? '--'
  : (v >= 1e8 ? (v / 1e8).toFixed(2) + ' 亿' : (v >= 1e4 ? (v / 1e4).toFixed(0) + ' 万' : String(Math.round(v))));
const OP_LABEL = { buy: '🟢 买入', hold: '🔁 续持', adjust: '⚖️ 调差额', sell: '🔴 卖出',
                   miss: '⚠️ 未成交', div: '💰 分红', cash: '💵 扫入货币ETF', cash_out: '💵 货币ETF赎回' };
const ACT_LABEL = { rotate: '轮换', hold: '持仓不动（择时）', cash: '清仓避险（买货币ETF）' };

function lineChart(id, labels, datasets, yTitle) {
  new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top' } },
      scales: {
        x: { type: 'time', time: { tooltipFormat: 'yyyy-MM-dd' },
             ticks: { maxTicksLimit: 12, maxRotation: 0 } },
        y: { title: { display: true, text: yTitle } }
      }
    }
  });
}

// 当年序列：以上一年最后一个交易日净值为基准归一（年初 = 1）
function ytdSeries(nav, key) {
  const year = nav[nav.length - 1].date.slice(0, 4);
  const prev = nav.filter(d => d.date < year + '-01-01');
  const cur = nav.filter(d => d.date >= year + '-01-01');
  const base = prev.length ? prev[prev.length - 1][key] : cur[0][key];
  return { year, labels: cur.map(d => d.date), values: cur.map(d => base ? d[key] / base : null) };
}

// 与 backtest_etf.py 的 _perf() 同口径：252 交易日年化、std 用 ddof=1
function perfFromNav(vals) {
  const v = (vals || []).filter(x => x != null && !isNaN(x) && x > 0);
  if (v.length < 3) return {};
  const rets = [];
  for (let i = 1; i < v.length; i++) rets.push(v[i] / v[i - 1] - 1);
  const n = rets.length;
  const mean = rets.reduce((a, b) => a + b, 0) / n;
  const sd = n > 1 ? Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  const last = v[v.length - 1];
  const years = Math.max(v.length / 252, 1e-9);
  const ann = last > 0 ? Math.pow(last, 1 / years) - 1 : null;
  let peak = v[0], mdd = 0;
  for (const x of v) { if (x > peak) peak = x; const dd = x / peak - 1; if (dd < mdd) mdd = dd; }
  return { total: last - 1, ann, vol: sd * Math.sqrt(252),
           sharpe: sd > 0 ? mean / sd * Math.sqrt(252) : null,
           mdd, calmar: (mdd < 0 && ann != null) ? ann / Math.abs(mdd) : null };
}

function ytdFromNav(nav) {
  if (!nav.length) return null;
  const out = {};
  for (const k of ['strategy', 'pool', 'benchmark']) {
    const ys = ytdSeries(nav, k);
    out.year = ys.year;
    out[k] = perfFromNav(ys.values);
  }
  return out;
}

// 单期持仓表（⑦ 最新一期 与 ⑧ 历史查询 共用）
function etfTable(rec) {
  const head = `<tr><th>代码</th><th>名称</th><th class="num">综合得分</th><th class="num">7日涨幅</th>
    <th class="num">溢价率</th><th class="num">信号价</th><th class="num">成交价</th><th class="num">日均成交量</th>
    <th class="num">份额</th><th class="num">市值(元)</th><th class="num">权重</th><th>操作</th></tr>`;
  const tv = rec.total_value || 0;
  const rows = [...(rec.etfs || [])]
    .sort((a, b) => (b.rank_total ?? -1) - (a.rank_total ?? -1)
      || String(a.code).localeCompare(String(b.code)))
    .map(s => {
      const w = (s.value != null && tv) ? s.value / tv : null;
      return `<tr>
        <td style="color:#888">${s.code}</td>
        <td style="font-weight:600;white-space:normal">${s.name || '--'}${s.buffer ? ' <span style="font-size:10px;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:3px;padding:0 3px;font-weight:400;white-space:nowrap" title="缓冲持仓：靠缓冲池留下、不在本期买入名单的老仓">缓冲</span>' : ''}</td>
        <td class="num">${fmtNum(s.rank_total, 1)}</td>
        <td class="num ${pctColor(s.increase_net)}">${fmtPct(s.increase_net)}</td>
        <td class="num" style="color:#666">${fmtPct(s.unit_net)}</td>
        <td class="num" style="color:#999">${fmtNum(s.price, 3)}</td>
        <td class="num">${fmtNum(s.exec_price, 3)}</td>
        <td class="num">${fmtVol(s.volumn)}</td>
        <td class="num">${s.shares != null ? s.shares.toLocaleString('zh-CN') : '--'}</td>
        <td class="num">${fmtWan(s.value)}</td>
        <td class="num">${fmtPct(w)}</td>
        <td>${OP_LABEL[s.op] || s.op || '--'}</td>
      </tr>`;
    }).join('');
  const mv = (rec.etfs || []).reduce((a, s) => a + (s.value || 0), 0);
  const foot = `<tr class="foot-row">
      <td colspan="8">现金 ${fmtWan(rec.cash)} 元 ｜ 调仓后总值 ${fmtWan(rec.total_value)} 元
        ｜ 本期换手(单边) ${fmtPct(rec.turnover)} ｜ 累计手续费 ${fmtWan(rec.fee_total)} 元</td>
      <td class="num" colspan="2">持仓市值 ${fmtWan(mv)}</td>
      <td class="num" colspan="2">${(rec.etfs || []).length} 只</td></tr>`;
  return head + rows + foot;
}

let REBAL = [];
let PARAMS = {};
function renderRebal(i) {
  const r = REBAL[i];
  if (!r) return;
  document.getElementById('rebalTable').innerHTML = etfTable(r);
  const corrTxt = (PARAMS.corr_cap != null)
    ? ` → 相关性去重（阈值 ${PARAMS.corr_cap}／${PARAMS.corr_window ?? 60} 日）跳过 ${r.corr_skipped ?? 0} 只高相关 → 候选 TOP${PARAMS.optional_n ?? '--'}`
    : '（相关性去重未启用）';
  document.getElementById('rebal-meta').innerHTML =
    `${fmtDate(r.date)} 调仓（${ACT_LABEL[r.action] || r.action}），持有至 ${fmtDate(r.end_date)}；`
    + `成交量过滤后基金池 ${r.pool_n ?? '--'} 只 → 同指数去重后 ${r.cluster_n ?? '--'} 只（${r.k ?? '--'} 个指数组）；`
    + `溢价率缺失剔除 ${r.nav_missing ?? 0} 只${corrTxt}`
    + (r.signal != null ? `；择时信号 ${fmtNum(r.signal, 3)}` : '');
}

async function render() {
  let data = null;
  try {
    data = await fetchJson(`${DATA_DIR}/backtest_etf.json`);
  } catch (e) {
    document.getElementById('page-desc').textContent =
      '⚠️ 数据文件尚未就绪（' + e.message + '）。请确认 python_files/etf/backtest_etf.py 已运行，'
      + '且 chart/data/etf/backtest_etf.json 已随 chart/ 推送到 GitHub。';
    return;
  }

  const p = data.params || {}, m = data.metrics || {}, nav = data.nav || [];
  PARAMS = p;
  if (!nav.length) {
    document.getElementById('page-desc').textContent = '⚠️ backtest_etf.json 中没有净值序列。';
    return;
  }
  const poolKey = Object.keys(m).find(k => /^top\d+_equal_weight$/.test(k));
  const poolM = poolKey ? m[poolKey] : {};
  const poolName = `TOP${p.optional_n ?? 20} 等权池`;
  const s = m.strategy || {}, b = m.index_benchmark || {};
  const benchName = p.benchmark || '指数基准';
  const cap = (p.init_capital || 1000000) / 1e4;   // 万元
  const my = data.metrics_ytd || ytdFromNav(nav);
  const ys = (my && my.strategy) || {}, yb = (my && my.benchmark) || {};

  document.getElementById('page-desc').textContent =
    `回测区间 ${fmtDate(p.start)} ~ ${fmtDate(p.end)}（${p.rebal || '每周调仓'}）`;
  document.getElementById('asset-title').textContent =
    `⑤ 总资产曲线（初始资金 ${cap.toLocaleString('zh-CN')} 万）`;

  // 统计卡
  const lastNav = nav[nav.length - 1];
  document.getElementById('stat-range').textContent = `${fmtDate(p.start)} ~ ${fmtDate(p.end)}`;
  document.getElementById('stat-nav').textContent = fmtNum(lastNav.strategy, 3);
  const elT = document.getElementById('stat-total');
  elT.textContent = fmtPct(s.total); elT.className = 'value ' + pctColor(s.total);
  if (my && my.year) document.getElementById('stat-ytd-label').textContent = `${my.year} 年收益`;
  const elY = document.getElementById('stat-ytd');
  elY.textContent = fmtPct(ys.total); elY.className = 'value ' + pctColor(ys.total);

  // ① 累计净值对比
  const labels = nav.map(d => d.date);
  const dsStrat = { label: `策略 TOP${p.top_n ?? 10}（轮动）`, data: nav.map(d => d.strategy),
    borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.08)', pointRadius: 0, borderWidth: 1.8 };
  const dsBench = { label: benchName, data: nav.map(d => d.benchmark),
    borderColor: '#f59e0b', pointRadius: 0, borderWidth: 1.4 };
  const dsPool = { label: poolName, data: nav.map(d => d.pool),
    borderColor: '#94a3b8', borderDash: [4, 3], pointRadius: 0, borderWidth: 1.2 };
  lineChart('navChart', labels, [dsStrat, dsBench, dsPool], '净值');

  // ② 当年净值对比
  const yS = ytdSeries(nav, 'strategy'), yB = ytdSeries(nav, 'benchmark'), yP = ytdSeries(nav, 'pool');
  lineChart('ytdChart', yS.labels, [
    { label: `策略 TOP${p.top_n ?? 10}（轮动）`, data: yS.values, borderColor: '#ef4444', pointRadius: 0, borderWidth: 1.8 },
    { label: benchName, data: yB.values, borderColor: '#f59e0b', pointRadius: 0, borderWidth: 1.4 },
    { label: poolName, data: yP.values, borderColor: '#94a3b8', borderDash: [4, 3], pointRadius: 0, borderWidth: 1.2 }
  ], '净值（年初=1）');

  // ③ 累计几何超额
  lineChart('excessChart', labels, [
    { label: `策略 / ${benchName}`, data: nav.map(d => d.benchmark ? +(d.strategy / d.benchmark).toFixed(4) : null),
      borderColor: '#6366f1', pointRadius: 0, borderWidth: 1.6 },
    { label: `策略 / ${poolName}`, data: nav.map(d => d.pool ? +(d.strategy / d.pool).toFixed(4) : null),
      borderColor: '#14b8a6', borderDash: [4, 3], pointRadius: 0, borderWidth: 1.2 },
    { label: '持平线(1)', data: nav.map(() => 1), borderColor: '#94a3b8', borderDash: [5, 4], pointRadius: 0, borderWidth: 1 }
  ], '超额（净值比）');

  // ④ 今年累计超额
  const exY = yS.values.map((v, i) =>
    (v != null && yB.values[i] != null && yB.values[i] !== 0) ? +(v / yB.values[i]).toFixed(4) : null);
  lineChart('ytdExcessChart', yS.labels, [
    { label: `当年 策略 / ${benchName}`, data: exY, borderColor: '#6366f1', pointRadius: 0, borderWidth: 1.6 },
    { label: '持平线(1)', data: yS.labels.map(() => 1), borderColor: '#94a3b8', borderDash: [5, 4], pointRadius: 0, borderWidth: 1 }
  ], '超额（净值比）');

  // ⑤ 总资产曲线
  lineChart('assetChart', labels, [
    { label: '策略总资产(万元)', data: nav.map(d => d.strategy * cap), borderColor: '#22c55e',
      backgroundColor: 'rgba(34,197,94,.08)', fill: true, pointRadius: 0, borderWidth: 1.8 },
    { label: '初始资金', data: nav.map(() => cap), borderColor: '#94a3b8', borderDash: [5, 4], pointRadius: 0, borderWidth: 1 }
  ], '总资产（万元）');

  // ⑥ 业绩表（累计 & 当年）
  const dash = '--';
  const rows = [
    ['累计收益', fmtPct(s.total), fmtPct(b.total), fmtPct(ys.total), fmtPct(yb.total)],
    ['年化收益', fmtPct(s.ann), fmtPct(b.ann), dash, dash],
    ['最大回撤', fmtPct(s.mdd), fmtPct(b.mdd), fmtPct(ys.mdd), fmtPct(yb.mdd)],
    ['年化波动', fmtPct(s.vol), fmtPct(b.vol), fmtPct(ys.vol), fmtPct(yb.vol)],
    ['夏普比率', fmtNum(s.sharpe), fmtNum(b.sharpe), fmtNum(ys.sharpe), fmtNum(yb.sharpe)],
    ['卡玛比率', fmtNum(s.calmar), fmtNum(b.calmar), fmtNum(ys.calmar), fmtNum(yb.calmar)],
    [`超额年化(vs ${benchName})`, fmtPct(m.excess_ann_vs_index != null ? m.excess_ann_vs_index
      : (s.ann != null && b.ann != null ? s.ann - b.ann : null)), dash, dash, dash],
    [`超额年化(vs ${poolName})`, (s.ann != null && poolM.ann != null) ? fmtPct(s.ann - poolM.ann) : dash,
      fmtPct(poolM.ann), dash, dash],
    ['Beta', fmtNum(m.beta), dash, dash, dash],
    ['Alpha(年化)', fmtPct(m.alpha_ann), dash, dash, dash],
    ['期数 / 胜率', `${m.periods ?? '--'} / ${fmtPct(m.win_rate)}`, dash, dash, dash],
    ['平均换手(单边)', fmtPct(m.avg_turnover), dash, dash, dash],
    ['累计手续费', m.total_fee != null ? `${fmtWan(m.total_fee)} 元` : dash, dash, dash, dash],
    ['累计现金分红', m.total_dividend != null ? `${fmtWan(m.total_dividend)} 元` : dash, dash, dash, dash]
  ];
  document.getElementById('perfTable').innerHTML =
    `<tr><th>指标</th><th class="num">累计·策略</th><th class="num">累计·${benchName}</th>
     <th class="num">当年·策略</th><th class="num">当年·${benchName}</th></tr>` +
    rows.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(v => `<td class="num">${v}</td>`).join('')}</tr>`).join('');

  let note = `当年收益以上一年最后一个交易日净值为基准（年初=1）${data.metrics_ytd ? '' : '，由前端按 nav 序列实时计算'}；`
    + `基准 ${benchName}；「${poolName}」= 每期候选池后复权等权（含分红），用于剥离择股能力与池子本身的贝塔。`;
  const tf = p.trade_fee;
  if (tf && tf.total != null) {
    const sl = (tf.slippage_mode === 'none' || !tf.slippage) ? '滑点 0'
      : (tf.slippage_mode === 'fixed'
        ? `滑点每份 ${tf.slippage} 元（买卖各承担 ${(tf.slippage / 2).toFixed(4)} 元）`
        : `滑点单边 ${(tf.slippage * 1e4).toFixed(1)} 万分之一`);
    note += ` 交易成本口径：成交价 ${p.exec || '--'} ／信号价 ${p.signal || '--'}，`
      + `佣金双边 ${(tf.comm_rate * 1e4).toFixed(1)} 万分之一（最低 ${tf.min_comm} 元/笔），`
      + `卖出印花税 ${(tf.stamp_tax * 1e4).toFixed(1)} 万分之一，${sl}；`
      + `回测期内累计扣除手续费 ${fmtWan(tf.total)} 元（滑点已直接体现在成交价上，不单列）。`;
  } else {
    note += ' 交易成本已在净值中扣除（累计手续费见上表）。';
  }
  document.getElementById('perf-note').textContent = note;

  // ⑦⑧ 持仓与历史换仓
  REBAL = data.rebalances || [];
  if (REBAL.length) {
    const last = REBAL[REBAL.length - 1];
    document.getElementById('holdTable').innerHTML = etfTable(last);
    document.getElementById('hold-sub').textContent =
      `最新调仓日 ${fmtDate(last.date)}（${ACT_LABEL[last.action] || last.action}），持有至 ${fmtDate(last.end_date)}；`
      + `信号价口径 ${p.signal || '--'}（仅用于排名）／成交价口径 ${p.exec || '--'}（份额、市值、权重按此计），`
      + `本策略未生成每日重估快照`;
    const sel = document.getElementById('rebalSelect');
    sel.innerHTML = REBAL.map((r, i) =>
      `<option value="${i}">${fmtDate(r.date)}（${(r.etfs || []).length} 只 · ${ACT_LABEL[r.action] || r.action}）</option>`).join('');
    sel.value = REBAL.length - 1;
    renderRebal(REBAL.length - 1);
    sel.addEventListener('change', () => renderRebal(Number(sel.value)));
  } else {
    document.getElementById('holdTable').innerHTML =
      '<tr><td style="color:#999;padding:16px">暂无换仓记录</td></tr>';
  }

}
render();
</script>

</body>
</html>
